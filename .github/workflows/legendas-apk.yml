name: Build APK - Legendas Dinâmicas

on:
  push:
    branches: [main]
    paths:
      - "legendas/**"
      - ".github/workflows/legendas-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legendas-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Instalar Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version

      - name: Extrair o projeto do ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          unzip -q legendas/source-project.zip -d .build-src
          test -f .build-src/legendas/app/build.gradle.kts
          test -f .build-src/legendas/app/src/main/kotlin/com/legendas/app/MainActivity.kt

      - name: Preparar modelo offline de português
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://github.com/BartekReterski/VoskModels/releases/download/v1/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk-model-pt.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          archive = pathlib.Path("/tmp/vosk-model-pt.zip")
          extract = pathlib.Path("/tmp/vosk-model-pt")
          target = pathlib.Path(".build-src/legendas/app/src/main/assets/model")
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              bad_member = z.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt Vosk model entry: {bad_member}")
              z.extractall(extract)
          source = extract / "vosk-model-small-pt-0.3"
          required = [
              "final.mdl", "mfcc.conf", "HCLr.fst", "Gr.fst",
              "disambig_tid.int", "word_boundary.int", "ivector/final.ie"
          ]
          missing = [name for name in required if not (source / name).is_file()]
          if missing:
              raise SystemExit(f"Missing Vosk model files: {missing}")
          shutil.copytree(source, target, dirs_exist_ok=True)
          print("Vosk legacy model files copied:", len(list(target.rglob("*"))))
          print("Vosk model size:", sum(p.stat().st_size for p in target.rglob("*") if p.is_file()))
          PY

      - name: Compilar APK
        run: gradle -p .build-src/legendas clean assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LegendasDinamicas-apk
          path: .build-src/legendas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
