name: Build APK - Legendas Dinâmicas

on:
  push:
    branches: [main]
    paths:
      - "legendas/**"
      - ".github/workflows/legendas-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legendas-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair o projeto do ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          unzip -q legendas/source-project.zip -d .build-src
          test -f .build-src/legendas/app/build.gradle.kts
          test -f .build-src/legendas/app/src/main/kotlin/com/legendas/app/MainActivity.kt

      - name: Preparar modelo offline de português
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR=".build-src/legendas/app/src/main/assets/model"
          mkdir -p "$MODEL_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk-model-pt.zip
          mkdir -p /tmp/vosk-model-pt
          unzip -q /tmp/vosk-model-pt.zip -d /tmp/vosk-model-pt
          MODEL_ROOT="$(find /tmp/vosk-model-pt -type d -name am -print -quit | xargs -r dirname)"
          test -n "$MODEL_ROOT"
          test -d "$MODEL_ROOT/conf"
          cp -a "$MODEL_ROOT/." "$MODEL_DIR/"
          test -d "$MODEL_DIR/am"
          test -d "$MODEL_DIR/conf"
          du -sh "$MODEL_DIR"

      - name: Compilar APK
        run: gradle -p .build-src/legendas clean assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LegendasDinamicas-apk
          path: .build-src/legendas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
