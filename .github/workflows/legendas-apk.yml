name: Build APK - Legendas Dinâmicas

on:
  push:
    branches: [main]
    paths:
      - "legendas/**"
      - ".github/workflows/legendas-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legendas-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair o projeto do ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-src
          unzip -q legendas/source-project.zip -d .build-src
          test -f .build-src/legendas/app/build.gradle.kts
          test -f .build-src/legendas/app/src/main/kotlin/com/legendas/app/MainActivity.kt

      - name: Preparar modelo offline de português
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR=".build-src/legendas/app/src/main/assets/model"
          mkdir -p "$MODEL_DIR"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://github.com/BartekReterski/VoskModels/releases/download/v1/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk-model-pt.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          archive = pathlib.Path("/tmp/vosk-model-pt.zip")
          extract = pathlib.Path("/tmp/vosk-model-pt")
          target = pathlib.Path(".build-src/legendas/app/src/main/assets/model")
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              print("Model archive entries:", len(z.namelist()))
              print("Archive test:", z.testzip())
              for info in z.infolist():
                  mode = (info.external_attr >> 16) & 0o170000
                  print("ZIP ENTRY:", repr(info.filename), "mode:", oct(mode), "size:", info.file_size)
              z.extractall(extract)
          print("Extracted tree:")
          for p in sorted(extract.rglob("*")):
              print("DIR:" if p.is_dir() else "FILE:", p, "->", p.read_text(errors="replace")[:200] if p.is_symlink() else "")
          candidates = [p.parent for p in extract.rglob("am")
                        if (p.is_dir() or p.is_symlink()) and (p.parent / "conf").exists()]
          if not candidates:
              raise SystemExit("Could not find Vosk model folders 'am' and 'conf'")
          shutil.copytree(candidates[0], target, dirs_exist_ok=True)
          if not (target / "am").exists() or not (target / "conf").exists():
              raise SystemExit("Vosk model folders were not copied correctly")
          print("Vosk model copied from:", candidates[0])
          print("Model size:", sum(p.stat().st_size for p in target.rglob("*") if p.is_file()))
          PY

      - name: Compilar APK
        run: gradle -p .build-src/legendas clean assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LegendasDinamicas-apk
          path: .build-src/legendas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
