name: Gerar APK Video Cutter 3s
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'video-cutter/**'
      - '.github/workflows/video-cutter-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle -p video-cutter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: video-cutter-3s-apk
          path: video-cutter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
